name: V1 validation
'on':
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: 'sqlite:///:memory:'
      SECURITY_BACKEND: memory
      SECRET_KEY: synthetic-ci-only-signing-key-0123456789abcdef
      PYTHONDONTWRITEBYTECODE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: python scripts/check_ci_inputs.py --history
      - run: python -m pip install --require-hashes -r requirements.lock
        working-directory: backend
      - run: python -m pip check
        working-directory: backend
      - run: ruff check app migrations --select E9,F63,F7,F82
        working-directory: backend
      - run: python -m pytest app/tests -q -p no:cacheprovider
        working-directory: backend
      - run: pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
        working-directory: backend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm test && npm run typecheck && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
